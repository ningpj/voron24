#####################################################################
[output_pin caselight] ; HE1 - Chamber lighting
#####################################################################

pin:                        PA3
pwm:                        True
cycle_time:                 0.02506                            ; 39.9Hz - reduce flickering COB leds
shutdown_value:             0
value:                      1.0 


#####################################################################
[gcode_macro _CASELIGHTS_ON]
#####################################################################
gcode:
    SET_PIN PIN=caselight VALUE=1.0


#####################################################################
[gcode_macro _CASELIGHTS_OFF]
#####################################################################
gcode:
    SET_PIN PIN=caselight VALUE=0


#####################################################################
[gcode_macro LIGHTS] ; toggle lights between preferred levels
#####################################################################

gcode:
    {% if printer['output_pin caselight'].value > 0 %}
       _CASELIGHTS_OFF
    {% else %}
       _CASELIGHTS_ON
    {% endif %}
    
