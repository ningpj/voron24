#####################################################################
; Voron 2.4 300mm Octopus Pro 1.1 TMC2240/TMC2209, SHT-36 v2 config
#####################################################################

; Pin Summary
; Hotend Fan                       SHT:PB10/FAN0
; Hotend Heater                    SHT:HE0
; Hotend Sensor                    SHT:TH0
; Part Fan                         SHT:PB11/FAN1
; Component Fan                    MCU:PA8 (VF0)
; Chamber Fan                      MCU:PE5 (VF1)
; Chamber LEDS                     MCU:PA3 (HE1)
; Endstop - X                      SHT:PA1 (LIMIT_0)
; Endstop - Y                      MCU:PG6 (STOP-0)
; Endstop - Z                      MCU:PG9 (STOP-1)
; Blobifier tray end stop          MCU:PG10 (STOP-2)
; Blobifier bucket                 MCU:PG11 (STOP-3)
; Probe - PCB Klicky               SHT:PC15 (PROBE_1)
; Toolhead sensor                  SHT:PA2 (LIMIT_1)
; Chamber Thermistor               MCU:PF4 (T0)   
; Bed Thermister                   MCU:PF3 (TB)
; Print Head Neopixels             SHT:PB0 (RGBLED)

[mcu] ; Octopus Pro v1.1 - usb CANbus bridge mode
canbus_uuid:                1a06bf5e7f88

[mcu sht] ; Fly Sht-36 v2 toolhead
canbus_uuid:                333f11f63709

[printer]
kinematics:                 corexy
max_velocity:               1200                                
max_accel:                  7000
minimum_cruise_ratio:       0.20
max_z_velocity:             60
max_z_accel:                350
square_corner_velocity:     5 

[board_pins sht] ; Fly SHT-36 v2
mcu: sht
aliases:
    EXT_EN=PA15,  EXT_STEP=PB4,  EXT_DIR=PB3,  EXT_UART=PB5,  EXT_DIAG=PB6,  ; extruder stepper
    LIMIT_0=PA1,  LIMIT_1=PA2,                                               ; end stops
    PROBE_1=PC15, PROBE_2=PB1,                                               ; probe
    FAN0=PB10,    FAN1=PB11,                                                 ; fans
    TH0=PA3,      PT1000=PB12,   TC0=PA4,                                    ; thermisters
    HE0=PA8,                                                                 ; HE0 heater 
    RGBLED=PB0,                                                              ; neopixel
    ADXL=PA9                                                                 ; adxl

[adxl345] 
cs_pin:                     sht:ADXL                            ; Fly SHT-36 v2 adxl
spi_bus:                    spi2

[resonance_tester]
accel_chip:                 adxl345
probe_points:               150,150,20.                         ; dead centre of 300mm plate
accel_per_hz:               100                                 ; generate more energy for z2 x rail - Default now 60
sweeping_period:            0                                   ; revert to old klipper resonance behavour

[pause_resume]
recover_velocity:           1000                                ; fast recovery speed

[exclude_object]

[display_status]

[respond]                                                       ; enable M118 write to console
default_prefix:


#####################################################################
[duplicate_pin_override] ; global pin overrides...only one block
#####################################################################

pins:                       PF3, PF4                            ; Bed thermister, Chamber thermister 


#####################################################################
; Included configurations. Need to keep steppers and certain settings
; local as klipper expects to find and update values in printer.cfg
#####################################################################
[include mysettings.cfg]                                        ; my variables and constants to use in macros  
[include hardware/*.cfg]                                        ; hardware related macros
[include mmu/base/*.cfg]                                        ; Happy Hare base configuraation
[include mmu/macros/*.cfg]                                      ; Happy Hare macros
[include macros/*.cfg]                                          ; other macros and overrides

# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[include mmu/optional/client_macros.cfg]


#####################################################################
[shaketune] ; Input shaper and belt analysis
#####################################################################
# result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep:  6
# keep_raw_data: False
# show_macros_in_webui: True
# max_freq: 200


#####################################################################
; Stepper configuration
#####################################################################

[autotune_tmc stepper_x]
motor:                      omc-17hs19-2504s-h
pwm_freq_target:            22e3

[autotune_tmc stepper_y]
motor:                      omc-17hs19-2504s-h
pwm_freq_target:            22e3

;[autotune_tmc extruder]
;motor:                     ldo-36sth20-1004ahg-9T

[autotune_tmc stepper_z]
motor:                      omc-17hs19-2004s1
tuning_goal:                performance
pwm_freq_target:            22e3

[autotune_tmc stepper_z1]
motor:                      omc-17hs19-2004s1
tuning_goal:                performance
pwm_freq_target:            22e3

[autotune_tmc stepper_z2]
motor:                      omc-17hs19-2004s1
tuning_goal:                performance
pwm_freq_target:            22e3

[autotune_tmc stepper_z3]
motor:                      omc-17hs19-2004s1
tuning_goal:                performance
pwm_freq_target:            22e3


###########################################
[stepper_x] ; MOTOR0 (B Motor/Left) X-Axis
###########################################

step_pin:                   PF13
dir_pin:                    !PF12
enable_pin:                 !PF14
rotation_distance:          40
microsteps:                 64         

full_steps_per_rotation:    200                                 ; 200 for 1.8 degree stepper. set to 400 for 0.9 degree stepper
endstop_pin:                ^sht:LIMIT_0

position_min:               -3
position_endstop:           300                                 ; 300mm build
position_max:               300                                 ; 300mm build

homing_speed:               100                                 ; max 100
homing_retract_dist:        5
homing_positive_dir:        true

[tmc2240 stepper_x] ; hardware spi bus 
cs_pin:                     PC4 
spi_bus:                    spi1
rref:                       12300
interpolate:                True                                ; enable for tmc autotune
run_current:                1.2                                 ; TMC2240 & OMC 17HS19-2504S-H (2.5A 1.1hm 1.6mH)


###########################################
[stepper_y] ; MOTOR1 (A Motor/Right) Y-Axis
###########################################

step_pin:                   PG0
dir_pin:                    !PG1
enable_pin:                 !PF15
rotation_distance:          40
microsteps:                 64         

full_steps_per_rotation:    200                                 ; 200 for 1.8 degree stepper. set to 400 for 0.9 degree stepper
endstop_pin:                ^PG6

position_min:               0
position_endstop:           310                                 ; 300mm build
position_max:               310                                 ; 300mm build

homing_speed:               100                                 ; max 100
homing_retract_dist:        5
homing_positive_dir:        true

[tmc2240 stepper_y] ; hardware spi bus
cs_pin:                     PD11 
spi_bus:                    spi1
rref:                       12300
interpolate:                True                                ; enable for tmc autotune
run_current:                1.2                                 ; TMC2240 & OMC 17HS19-2504S-H (2.5A 1.1hm 1.6mH)


###########################################
[stepper_z] ; MOTOR2 Z0 - Front Left
###########################################

step_pin:                   PF11
dir_pin:                    !PG3
enable_pin:                 !PG5
rotation_distance:          40
gear_ratio:                 80:16
microsteps:                 32
endstop_pin:                ^PG9                                ; Z- position
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config

position_max:               250                                 ; 300mm build - safe upper limit with cable chains
position_min:               -5
homing_speed:               13                                  ; non resonant speed
second_homing_speed:        3
homing_retract_dist:        3

[tmc2209 stepper_z]
uart_pin:                   PC6
interpolate:                True                               ; enable for tmc autotune
run_current:                0.6                                ; OMC 17HS19-2004S1 2A 1.4hm 3.0mH (80% = 1.4/0.8)
sense_resistor:             0.110
stealthchop_threshold:      0


############################################
[stepper_z1] ; MOTOR3 Z1 - Rear Left
############################################

step_pin:                   PG4
dir_pin:                    PC1
enable_pin:                 !PA2                              ; Octopus Pro 1.1 pin difference
rotation_distance:          40
gear_ratio:                 80:16
microsteps:                 32

[tmc2209 stepper_z1]
uart_pin:                   PC7
interpolate:                True                               ; enable for tmc autotune
run_current:                0.6                                ; OMC 17HS19-2004S1 2A 1.4hm 3.0mH (80% = 1.4/0.8)
sense_resistor:             0.110
stealthchop_threshold:      0


#############################################
[stepper_z2] ; MOTOR4 Z2 - Rear Right
#############################################

step_pin:                   PF9
dir_pin:                    !PF10
enable_pin:                 !PG2
rotation_distance:          40
gear_ratio:                 80:16
microsteps:                 32

[tmc2209 stepper_z2]
uart_pin:                   PF2
interpolate:                True                               ; enable for tmc autotune
run_current:                0.6                                ; OMC 17HS19-2004S1 2A 1.4hm 3.0mH (80% = 1.4/0.8)
sense_resistor:             0.110
stealthchop_threshold:      0


##############################################
[stepper_z3] ; MOTOR5 Z3 - Front Right
##############################################

step_pin:                   PC13
dir_pin:                    PF0
enable_pin:                 !PF1
rotation_distance:          40
gear_ratio:                 80:16
microsteps:                 32

[tmc2209 stepper_z3]
uart_pin:                   PE4
interpolate:                True                               ; enable for tmc autotune
run_current:                0.6                                ; OMC 17HS19-2004S1 2A 1.4hm 3.0mH (80% = 1.4/0.8)
sense_resistor:             0.110
stealthchop_threshold:      0


#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
[extruder] ; Yaroth with Rapido,
; PT1000 & Galileo 2.0 Wristwatch extruder
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

step_pin:                   sht:EXT_STEP
dir_pin:                    sht:EXT_DIR
enable_pin:                 !sht:EXT_EN
microsteps:                 16                                 ; WWG2
full_steps_per_rotation:    200                                ; WWG2
rotation_distance:          47.088                             ; WWG2 
gear_ratio:                 9:1                                ; WWG2 

max_extrude_only_velocity:  125                                
max_extrude_only_distance:  500                                ; increase to allow filament load & unload operations
max_extrude_cross_section:  15                                 ; override to support fat purge lines and blobs

nozzle_diameter:            0.600
filament_diameter:          1.750
heater_pin:                 sht:HE0
sensor_pin:                 sht:TH0
sensor_type:                PT1000
pullup_resistor:            1100
min_temp:                   0
max_temp:                   302
min_extrude_temp:           190
pwm_cycle_time:             0.02506                            ; 39.9Hz - reduce flickering COB leds

control:                    pid                                ; 110w Rapido - maintain instream rather than override section at end
pid_Kp:                     14.433
pid_Ki:                     1.577
pid_Kd:                     33.017

smooth_time:                0.5                                ; default is 1.0
; Try to keep pressure_advance below 1.0
pressure_advance:           0.030                              ; Rapido HF - default. overriden in print_start for different filament types using set_pa macro
pressure_advance_smooth_time: 0.025                            ; A Ellis Guide                              

[tmc2209 extruder]
uart_pin:                   sht:EXT_UART
diag_pin:                   sht:EXT_DIAG
interpolate:                False                              ; enable for tmc autotune
stealthchop_threshold:      0
sense_resistor:             0.11                               ; BTT 2209 Fly-SHT v2

run_current:                0.55                               ; TMC2209 tune: WWG2 with LDO 36STH20-1004AHG (1A 2.4hm 1.2mH)
hold_current:               0.3


#####################################################################
[heater_bed] ; HE0
#####################################################################

heater_pin:                 PA0
sensor_type:                Generic 3950
sensor_pin:                 PF3
max_power:                  1.0                                ; 600W/240v 15A Panasonic SSR fitted with Heat sink 
min_temp:                   0
max_temp:                   120
pwm_cycle_time:             0.02506                            ; 39.9Hz - reduce flickering COB leds

control:                    pid                                ; maintain instream rather than override section at end
pid_Kp:                     45.421                             ; calibrated with bed fans on
pid_Ki:                     2.940
pid_Kd:                     175.437


#####################################################################
;[firmware_retraction] ; Enable firmware retraction - A Ellis Guide
#####################################################################

;retract_length:             0.60
;retract_speed:              35
;unretract_extra_length:     0
;unretract_speed:            35


#####################################################################
[probe] ; Probe setup Z+ position - PCB Klicky
#####################################################################

; This probe is not used for Z height, only Quad Gantry Leveling

pin:                        ^sht:PROBE_1
x_offset:                   0
y_offset:                   30.5                                ; klicky PCB with Dragon Burner
z_offset:                   0

speed:                      8                                   ; up to 20mm/s tested but can result in over activation and premature microswitch failure
lift_speed:                 30                                  ; faster tends to be less reliable 
samples:                    3                                   ; number of probes
samples_result:             median                              ; more reliable - klipper default: average
sample_retract_dist:        2.0                                 ; speedy but reliable
samples_tolerance:          0.01                                ; improve reliability (0.0075 default)
samples_tolerance_retries:  6                                   ; improve reliability


#####################################################################
[idle_timeout]
#####################################################################

timeout:                    2700

gcode:
  M84                                                           ; disable motors
  TURN_OFF_HEATERS                                              ; heaters off
  M107                                                          ; turn off part fan
  BED_MESH_CLEAR                                                ; clear bed mesh
  SET_PIN PIN=caselight VALUE=0                                 ; turn case lights off
  SET_NOZZLE_LEDS_OFF                                           ; turn nozzle leds off


#####################################################################
[quad_gantry_level]
#####################################################################

; Gantry Corners for 300mm Build
gantry_corners:
                            -60,-10
                            360,370

; Adjusted 300mm probe points - Note these are absolute and arent relative to the probe position and offset (klicky)
points:
                            40, 18
                            40, 238
                            260,238
                            260,18

speed:                      800                                 ; speed up QGL
horizontal_move_z:          12                                  ; keep reasonably high for first pass incase gantry is really skewed
retries:                    6
retry_tolerance:            0.01                                ; improve reliability, default 0.0075
max_adjust:                 5


#####################################################################
[bed_mesh]
#####################################################################

speed:                      800                                ; speed up mesh
horizontal_move_z:          7                                   ; flying lower is OK as QGL "should" always run beforehand           
; Note these are relative to the probe position and print head offset
mesh_min:                   40, 40
mesh_max:                   260,260
probe_count:                5,5
zero_reference_position:    150,150                               ; hardwire to centre of bed as we can no longer probe the centre of the print :-(
algorithm:                  bicubic


#####################################################################
[input_shaper]
#####################################################################

shaper_type_x   = mzv
shaper_freq_x   = 66.4        ; 12870 accels
damping_ratio_x = 0.043
shaper_type_y   = mzv
shaper_freq_y   = 43.2        ; 5460 accels
damping_ratio_y = 0.065

